<!doctype html><meta charset="utf-8"><title>Tanda 7 · solo el caparazón</title><style>
body{margin:0;padding:20px;background:#eff2e6;color:#1d281a;font:12px ui-monospace,monospace}
h1{font:600 14px ui-monospace,monospace;margin:0 0 6px} p{margin:0 0 16px;max-width:80ch}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.c{background:#eff2e6;border:1px solid #9aa58c;border-radius:10px;padding:10px}
.row{display:flex;align-items:center;gap:14px;margin-top:8px}
.ink{background:#0e120d;border-radius:6px;padding:6px 10px}
svg{display:block}
</style>
<h1>Tanda 7 · solo el caparazón</h1>
<p>Vista cenital. Sin cabeza ni aletas: escudos irregulares separados por huecos, y el acento dentro del propio caparazón.</p>
<div class="grid" id="g"></div>
<script>
let uid=0;const rad=a=>a*Math.PI/180;const f=n=>+n.toFixed(2);
const cut=(d,w)=>`<path d="${d}" fill="none" stroke="#000" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const polar=(cx,cy,r,a)=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];
const pent=(cx,cy,r,rot=-90)=>[0,1,2,3,4].map(i=>polar(cx,cy,r,rot+72*i));
const P=p=>'M'+p.map(q=>q.map(f).join(' ')).join('L')+'Z';
function spiral(cx,cy,rmax,turns,a0,dir=1){const pts=[];const N=turns*40;for(let i=0;i<=N;i++){const t=i/N;const r=0.4+(rmax-0.4)*t;const a=a0+dir*t*turns*360;pts.push(polar(cx,cy,r,a))}return 'M'+pts.map(q=>q.map(f).join(' ')).join('L')}
function mask(shape,cuts){const id='m'+(++uid);return {defs:`<mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="#000"/>${shape}${cuts}</mask>`,id}}
const ell=(cx,cy,rx,ry)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff"/>`;
const ring=(cx,cy,r,w)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#000" stroke-width="${w}"/>`;
const shellInk=(m)=>`<defs>${m.defs}</defs><rect width="48" height="48" fill="currentColor" mask="url(#${m.id})"/>`;
const S={};
// S1 oval, pentagon centre + five rays (T1 shell, bigger)
S.S1=()=>{const cx=24,cy=24,rx=18,ry=20,c=[cx,cy-1.5],pp=pent(c[0],c[1],9.6);let cuts=cut(P(pp),1.8);
  pp.forEach(p=>{const d=[p[0]-c[0],p[1]-c[1]],l=Math.hypot(...d);cuts+=cut(`M${f(p[0])} ${f(p[1])}L${f(p[0]+d[0]/l*16)} ${f(p[1]+d[1]/l*16)}`,1.8)});
  const key=P(pp.map(p=>[c[0]+(p[0]-c[0])*0.8,c[1]+(p[1]-c[1])*0.8]));
  return shellInk(mask(ell(cx,cy,rx,ry),cuts))+`<path d="${key}" fill="var(--ac)"/>`};
// S2 circle ring of 8 + spiral knockout + moss dot at the centre
S.S2=()=>{const cx=24,cy=24;let cuts=ring(cx,cy,12.6,1.8)+cut(spiral(cx,cy,9.6,2.6,-60),1.9);
  for(let a=22.5;a<360;a+=45){const p=polar(cx,cy,12.6,a),q=polar(cx,cy,21,a);cuts+=cut(`M${f(p[0])} ${f(p[1])}L${f(q[0])} ${f(q[1])}`,1.8)}
  return shellInk(mask(`<circle cx="${cx}" cy="${cy}" r="19.5" fill="#fff"/>`,cuts))+`<circle cx="${cx}" cy="${cy}" r="1.8" fill="var(--ac)"/>`};
// S3 the real structure: marginal ring + five costal plates + pentagon keystone
S.S3=()=>{const cx=24,cy=24,rx=18.5,ry=20.5,k=4.6,c=[cx,cy-0.5],pp=pent(c[0],c[1],7.2);
  let cuts=`<ellipse cx="${cx}" cy="${cy}" rx="${rx-k}" ry="${ry-k}" fill="none" stroke="#000" stroke-width="1.7"/>`+cut(P(pp),1.7);
  pp.forEach(p=>{const d=[p[0]-c[0],p[1]-c[1]],l=Math.hypot(...d);cuts+=cut(`M${f(p[0])} ${f(p[1])}L${f(c[0]+d[0]/l*(rx-k))} ${f(c[1]+d[1]/l*(ry-k))}`,1.7)});
  for(let a=0;a<360;a+=30){const t=rad(a+15);cuts+=cut(`M${f(cx+(rx-k)*Math.cos(t))} ${f(cy+(ry-k)*Math.sin(t))}L${f(cx+(rx+2)*Math.cos(t))} ${f(cy+(ry+2)*Math.sin(t))}`,1.7)}
  const key=P(pp.map(p=>[c[0]+(p[0]-c[0])*0.78,c[1]+(p[1]-c[1])*0.78]));
  return shellInk(mask(ell(cx,cy,rx,ry),cuts))+`<path d="${key}" fill="var(--ac)"/>`};
// S4 ring of 5 irregular plates, clear centre with a moss spiral
S.S4=()=>{const cx=24,cy=24;let cuts=`<circle cx="${cx}" cy="${cy}" r="10.4" fill="#000"/>`+ring(cx,cy,19.5,0);
  [8,84,150,224,292].forEach(a=>{const p=polar(cx,cy,10,a),q=polar(cx,cy,21,a);cuts+=cut(`M${f(p[0])} ${f(p[1])}L${f(q[0])} ${f(q[1])}`,1.9)});
  const sp=`<path d="${spiral(cx,cy,8.2,2.3,-40)}" fill="none" stroke="var(--ac)" stroke-width="2.2" stroke-linecap="round"/>`;
  return shellInk(mask(`<circle cx="${cx}" cy="${cy}" r="19.5" fill="#fff"/>`,cuts))+sp};
// S5 ring of 8 with clear centre, moss spiral
S.S5=()=>{const cx=24,cy=24;let cuts=`<circle cx="${cx}" cy="${cy}" r="11.2" fill="#000"/>`;
  for(let a=22.5;a<360;a+=45){const p=polar(cx,cy,11,a),q=polar(cx,cy,21,a);cuts+=cut(`M${f(p[0])} ${f(p[1])}L${f(q[0])} ${f(q[1])}`,1.8)}
  const sp=`<path d="${spiral(cx,cy,8.6,2.5,-70)}" fill="none" stroke="var(--ac)" stroke-width="2.3" stroke-linecap="round"/>`;
  return shellInk(mask(`<circle cx="${cx}" cy="${cy}" r="19.5" fill="#fff"/>`,cuts))+sp};
// S6 oval, pentagon plate in moss with a spiral knockout, rays
S.S6=()=>{const cx=24,cy=24,rx=18,ry=20,c=[cx,cy-1.5],pp=pent(c[0],c[1],10);let cuts=cut(P(pp),1.8);
  pp.forEach(p=>{const d=[p[0]-c[0],p[1]-c[1]],l=Math.hypot(...d);cuts+=cut(`M${f(p[0])} ${f(p[1])}L${f(p[0]+d[0]/l*16)} ${f(p[1]+d[1]/l*16)}`,1.8)});
  const key=P(pp.map(p=>[c[0]+(p[0]-c[0])*0.82,c[1]+(p[1]-c[1])*0.82]));
  const km=`<mask id="k${++uid}" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="#fff"/>${cut(spiral(c[0],c[1],5.6,2.2,-50),1.5)}</mask>`;
  return shellInk(mask(ell(cx,cy,rx,ry),cuts))+`<defs>${km}</defs><path d="${key}" fill="var(--ac)" mask="url(#k${uid})"/>`};
const g=document.getElementById('g');
const mk=(inner,size,fg,ac)=>`<svg width="${size}" height="${size}" viewBox="0 0 48 48" style="color:${fg};--ac:${ac}">${inner}</svg>`;
for(const [k,fn] of Object.entries(S)){
 const inner=fn();const el=document.createElement('div');el.className='c';
 const A=s=>mk(inner,s,'#1d281a','#4c6b3a'),B=s=>mk(inner,s,'#eaece4','#8cb278');
 el.innerHTML=`<b>${k}</b><div class="row">${A(200)}<div><div class="row" style="margin:0">${A(64)}${A(32)}${A(24)}${A(16)}</div><div class="row ink">${B(64)}${B(24)}${B(16)}</div></div></div>`;
 g.appendChild(el)}
</script>
