<!doctype html><meta charset="utf-8"><style>
body{margin:0;padding:20px;background:#eff2e6;color:#1d281a;font:12px ui-monospace,monospace}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.c{background:#eff2e6;border:1px solid #9aa58c;border-radius:10px;padding:10px}
.row{display:flex;align-items:center;gap:14px;margin-top:8px}
.ink{background:#0e120d;border-radius:6px;padding:6px 10px}
svg{display:block}
</style><div class="grid" id="g"></div>
<script>
const rad=a=>a*Math.PI/180;
const hexPts=(cx,cy,r)=>Array.from({length:6},(_,i)=>[cx+r*Math.cos(rad(-90+60*i)),cy+r*Math.sin(rad(-90+60*i))]);
const area=p=>p.reduce((s,q,i)=>{const n=p[(i+1)%p.length];return s+(q[0]*n[1]-n[0]*q[1])},0)/2;
function inset(p,d){ // convex polygon inward offset by d
  const sgn=area(p)>0?1:-1, n=p.length, L=[];
  for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy);
    const nx=sgn*-dy/l,ny=sgn*dx/l; L.push([[a[0]+nx*d,a[1]+ny*d],[dx/l,dy/l]]);}
  return p.map((_,i)=>{const [p1,d1]=L[(i+n-1)%n],[p2,d2]=L[i];const det=d1[0]*d2[1]-d1[1]*d2[0];
    const t=((p2[0]-p1[0])*d2[1]-(p2[1]-p1[1])*d2[0])/det; return [p1[0]+d1[0]*t,p1[1]+d1[1]*t];});
}
const poly=(p)=>'M'+p.map(q=>q.map(v=>+v.toFixed(2)).join(' ')).join('L')+'Z';
const G=0.6; // half gap
// flower of seven hex cells, r cell
function flower(cx,cy,r){const d=Math.sqrt(3)*r;const cells=[[cx,cy]];for(let k=0;k<6;k++)cells.push([cx+d*Math.cos(rad(60*k)),cy+d*Math.sin(rad(60*k))]);return cells;}
function hexes(cells,r){return cells.map(c=>poly(inset(hexPts(c[0],c[1],r),G)))}
const V={};
// V1..V4 flower shells top view
const fc=flower(24,28,6.6);
V.V1={ink:[...hexes(fc,6.6)],acc:[poly(hexPts(24,8.6,3.9))]};
V.V2={ink:[...hexes(fc.slice(1),6.6),poly(hexPts(24,8.6,3.9))],acc:[hexes(fc.slice(0,1),6.6)[0]]};
const fl=[[37.6,13.2],[10.4,13.2],[37.6,42.8],[10.4,42.8]].map(c=>poly(hexPts(c[0],c[1],3.2)));
V.V3={ink:[...hexes(fc,6.6),...fl],acc:[poly(hexPts(24,8.2,3.9))]};
V.V4={ink:[...hexes(fc.slice(1),6.6),...fl,poly(hexPts(24,8.2,3.9))],acc:[hexes(fc.slice(0,1),6.6)[0]]};
// V5 lateral ashlar shell: three plates, legs, accent head
V.V5={ink:[
  poly([[3,36],[11.5,20],[16.9,20],[13.4,36]]),
  poly([[18.1,20],[23.9,20],[27.4,36],[14.6,36]]),
  poly([[25.1,20],[30.5,20],[39,36],[28.6,36]]),
  poly([[9.5,37.4],[13.5,37.4],[13.5,42],[9.5,42]]),
  poly([[28.5,37.4],[32.5,37.4],[32.5,42],[28.5,42]])],
  acc:[poly(hexPts(43,31.5,3.8))]};
// V6 pinwheel: hexagon split into three pentagons, head accent
function pinwheel(cx,cy,R,head,limbs){
  const V6=hexPts(cx,cy,R), C=[cx,cy];
  const M=(k)=>[cx+R*Math.sqrt(3)/2*Math.cos(rad(-60+60*k)),cy+R*Math.sqrt(3)/2*Math.sin(rad(-60+60*k))];
  const plates=[[C,M(1),V6[2],V6[3],M(3)],[C,M(3),V6[4],V6[5],M(5)],[C,M(5),V6[0],V6[1],M(1)]].map(p=>poly(inset(p,G)));
  const ink=[...plates];
  if(limbs) for(const c of [[cx+R*0.98+3.2,cy-R*0.62],[cx-R*0.98-3.2,cy-R*0.62],[cx+R*0.98+3.2,cy+R*0.62+3.5],[cx-R*0.98-3.2,cy+R*0.62+3.5]]) ink.push(poly(hexPts(c[0],c[1],3)));
  return {ink,acc:[poly(hexPts(cx,cy-R-3.6,3.6))]};
}
V.V6=pinwheel(24,28,15,true,false);
V.V7=pinwheel(24,28,13.5,true,true);
// V8 pinwheel with accent plate instead of head
{const p=pinwheel(24,28,15,true,false);V.V8={ink:[p.ink[0],p.ink[1],poly(hexPts(24,9.6,3.6))],acc:[p.ink[2]]};}
const g=document.getElementById('g');
function mk(c,size,fg,ac){return `<svg width="${size}" height="${size}" viewBox="0 0 48 48"><g fill="${fg}">${c.ink.map(d=>`<path d="${d}"/>`).join('')}</g><g fill="${ac}">${c.acc.map(d=>`<path d="${d}"/>`).join('')}</g></svg>`}
for(const [k,c] of Object.entries(V)){
 const el=document.createElement('div');el.className='c';
 const A=(s)=>mk(c,s,'#1d281a','#4c6b3a'),B=(s)=>mk(c,s,'#eaece4','#8cb278');
 el.innerHTML=`<b>${k}</b><div class="row">${A(150)}<div><div class="row" style="margin:0">${A(48)}${A(32)}${A(24)}${A(16)}</div><div class="row ink">${B(48)}${B(16)}</div></div></div>`;
 g.appendChild(el)}
</script>
